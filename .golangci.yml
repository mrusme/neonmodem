version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - exhaustive
    - govet
    - ineffassign
    - intrange
    - modernize
    - nilerr
    - noctx
    - perfsprint
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - os.Remove
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
    exhaustive:
      default-signifies-exhaustive: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      - path: internal/system/lobsters/web\.go
        linters:
          - bodyclose
      - path: internal/system/discourse/connect_test\.go
        linters:
          - staticcheck
        text: SA1019
